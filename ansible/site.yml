
- name: Baseline host hardening for Terraform-managed VM workloads
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure unattended-upgrades is installed (Debian family)
      ansible.builtin.package:
        name: unattended-upgrades
        state: present
      when: ansible_os_family == "Debian"

    - name: Keep OpenSSH server installed
      ansible.builtin.package:
        name: openssh-server
        state: present

    - name: Ensure UFW package is installed on Debian family
      ansible.builtin.package:
        name: ufw
        state: present
      when: ansible_os_family == "Debian"

    - name: Allow OpenSSH through UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH
      when: ansible_os_family == "Debian"

    - name: Enable UFW with deny default
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny
      when: ansible_os_family == "Debian"
